# XcodeGen spec for the macOS app. The generated ScanDesk.xcodeproj is committed,
# so XcodeGen is only needed if you change project settings:  cd macOS && xcodegen
name: ScanDesk
options:
  bundleIdPrefix: com.matthewdeluxe
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ScanDesk:
    type: application
    platform: macOS
    sources:
      - path: ScanDesk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewdeluxe.ScanDesk
        PRODUCT_NAME: ScanDesk
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ScanDesk
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "Released under the MIT License."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ScanDesk/ScanDesk.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        COMBINE_HIDPI_IMAGES: YES
